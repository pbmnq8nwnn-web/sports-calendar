# 運動賽事訂閱設定
# 修改下面的隊伍清單以變更追蹤對象，commit 後 GitHub Actions 會自動更新 .ics

timezone: Asia/Taipei

nba:
  enabled: true
  # 只有 tracked_players「本季是預測先發」的場次才會出現在行事曆
  # teams 是抓資料範圍：新增追蹤球員時，記得把他所屬的球隊也加進這裡，
  # 否則系統根本不會去抓他球隊的賽程，永遠偵測不到他
  # 沒有設 tracked_players 時 → 維持舊行為，teams 的比賽全收
  # ESPN team id 對照: lakers=13, spurs=24, warriors=9, celtics=2,
  # mavericks=6, suns=21, thunder=25, bucks=15, sixers=20, nuggets=7, heat=14
  teams:
    - { id: 13, name: "Los Angeles Lakers", zh: "湖人" }
    - { id: 20, name: "Philadelphia 76ers", zh: "76人" }
    - { id: 7, name: "Denver Nuggets", zh: "金塊" }
  # 追蹤特定球員：命中才產生事件，summary 後綴 🎯名字
  #
  # ⚠️ 跟 MLB 的重要差別：NBA 沒有「賽前先發預告」這種資料。
  #    ESPN 的先發名單要等比賽開打後才有，對行事曆來說太晚。
  #    所以這裡用「ESPN 該季深度表 rank 1（預測先發五人）」當替代判斷，
  #    它是「整季一張」的預測表，不是逐場判斷，命中的話該隊全季比賽都會收錄。
  #
  # track: "starter" 深度表 rank 1（預測先發）＋ 未被列為長期缺陣
  # track: "roster"  只要在現役名單、未被列為長期缺陣就算（不管先不先發）
  tracked_players:
    - { id: 3945274, team_id: 13, zh: "077", track: "starter" }  # Luka Doncic
    - { id: 1966, team_id: 20, zh: "LBJ", track: "starter" }  # LeBron James
    - { id: 3112335, team_id: 7, zh: "小丑", track: "starter" }  # Nikola Jokic
  # 球員被列為 Out 時要不要照樣收錄該隊比賽
  # false = 傷停期間該隊比賽從行事曆消失（會反覆新增／移除，Telegram 通知較吵）
  # true  = 照樣收錄，只是不加 🎯（先用 true，觀察一季再說）
  include_when_injured: true

mlb:
  enabled: true
  # 只有 tracked_players 出賽的場次才會出現在行事曆（其餘場次不顯示）
  # teams 是抓資料範圍：新增追蹤球員時，記得把他所屬的球隊也加進這裡，
  # 否則系統根本不會去抓他球隊的賽程，永遠偵測不到他出賽
  # MLB team id 對照: dodgers=119, yankees=147, astros=117, tigers=116,
  # padres=135, redsox=111, mets=121, braves=144, phillies=143
  teams:
    - { id: 119, name: "Los Angeles Dodgers", zh: "道奇" }
    - { id: 117, name: "Houston Astros", zh: "太空人" }
    - { id: 116, name: "Detroit Tigers", zh: "老虎" }
    - { id: 111, name: "Boston Red Sox", zh: "紅襪" }
  # 追蹤特定選手出賽：只有命中才會產生事件，summary 後綴 🎯名字
  # track: "pitcher" 用 probablePitcher（投手先發資訊，遠期都能拿到）
  # track: "lineup"  用 lineups（野手陣容，只在賽前數小時才有，命中時間點較晚）
  # track: "both"    投手＋打者都查（用於兩刀流球員）
  tracked_players:
    - { id: 660271, zh: "大谷翔平", track: "both" }
    - { id: 808967, zh: "山本由伸", track: "pitcher" }
    - { id: 808963, zh: "佐佐木朗希", track: "pitcher" }
    - { id: 701678, zh: "李灝宇", track: "lineup" }
    - { id: 678906, zh: "鄧愷威", track: "pitcher" }
    - { id: 691907, zh: "鄭宗哲", track: "lineup" }

f1:
  enabled: true
  season: 2026
  # 要納入的場次類型
  sessions:
    qualifying: true        # 排位賽
    race: true              # 正賽
    sprint_qualifying: true # Sprint 排位（只在 Sprint 週末有）
    sprint: true            # Sprint 正賽（只在 Sprint 週末有）
    practice1: false
    practice2: false
    practice3: false

vnl:
  enabled: true
  season: 2026
  # 官網 API 的賽事編號（小組賽＋決賽週都靠這個抓）。換屆時更新：
  # 打開官網賽程頁 → 開發者工具 Network → 找 /api/v1/volley-tournament/.../{男;女}
  tournaments:
    men: 1661
    women: 1662
  # 男排 / 女排各自追蹤的隊伍（英文名，需跟官網 API 隊名一致，如 Japan / Brazil）
  teams:
    men:
      - "Japan"
    women:
      - "Japan"
      - "Brazil"

worldcup:
  enabled: true
  # ESPN team name 對照（注意拼法）
  teams:
    - "Argentina"
    - "Brazil"
    - "France"
    - "England"
    - "Japan"
    - "South Korea"
    - "Norway"
    - "Portugal"
    - "Spain"
    - "Croatia"
  # 淘汰賽是否全部納入（不限定隊伍）
  # false = 只收選擇隊伍晉級的場次（小組賽結束後 ESPN 更新隊名才會出現）
  # true  = 全部淘汰賽都納入
  knockout_all: false
